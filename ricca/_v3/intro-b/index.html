<style>
:root {
  --paper: #F7F5F0; --paper-2: #EEEAE3;
  --ink: #111111; --ink-2: rgba(17,17,17,.78); --ink-3: rgba(17,17,17,.70);
  --line: rgba(17,17,17,.12); --line-2: rgba(17,17,17,.30);
  --serif: 'Cormorant', 'Garamond', Georgia, serif;
  --sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --gutter: clamp(24px, 6.5vw, 104px);
  --nav-h: 84px;
  --ease-out: cubic-bezier(.16,1,.3,1);
}
@media (max-width: 899px) { :root { --nav-h: 64px; } }

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink-2); font: 400 15px/1.65 var(--sans); -webkit-font-smoothing: antialiased; font-synthesis: none; overflow-x: clip; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
h1, p, figure { margin: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
::selection { background: var(--ink); color: var(--paper); }
.nowrap { white-space: nowrap; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.skip-link { position: fixed; top: 8px; left: 8px; z-index: 100; padding: 12px 16px; background: var(--ink); color: var(--paper); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
.wrap { width: min(100% - 2 * var(--gutter), 1280px); margin-inline: auto; }

/* ---------- шапка: тонкая, мелкая; логотип — та же точка, куда приземляется слово интро ---------- */
.nav { position: relative; z-index: 10; }
.nav__row { height: var(--nav-h); display: flex; align-items: center; gap: 40px; }
.lockup { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); }
.lockup__mono { width: auto; height: 19px; color: var(--ink); }
.lockup__rule { width: 1px; height: 22px; background: var(--line-2); margin: 0 16px; }
.lockup__text { display: flex; flex-direction: column; align-items: flex-start; }
/* буквы — отдельными строчными блоками с промежутком gap (не letter-spacing): у каждой рамка = глиф, по ней считается FLIP */
.lockup__name { display: flex; gap: .78em; font: 400 15px/1 var(--sans); color: var(--ink); }
.lockup__name > span { display: block; }
.lockup__sub { margin-top: 7px; font: 500 8px/1 var(--sans); letter-spacing: .36em; color: var(--ink-3); white-space: nowrap; }
.nav__menu { margin-left: auto; display: flex; gap: clamp(20px, 2.6vw, 40px); }
.nav__menu a, .nav__wa { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font: 500 11px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); transition: color .3s; }
.nav__menu a:hover { color: var(--ink); }
.nav__menu .ico { width: 12px; height: 12px; }
.nav__wa { padding: 0 18px; min-height: 40px; border: 1px solid var(--line-2); color: var(--ink); transition: border-color .3s; }
.nav__wa:hover { border-color: var(--ink); }
.nav__wa .ico { width: 16px; height: 16px; }
@media (max-width: 1099px) { .nav__menu { display: none; } .nav__wa { margin-left: auto; } }
@media (max-width: 899px) {
  .lockup__mono, .lockup__rule { display: none; }
  .lockup__name { font-size: 14px; gap: .74em; }
  .lockup__sub { font-size: 7.5px; margin-top: 6px; }
  .nav__wa { width: 44px; height: 44px; padding: 0; justify-content: center; }
  .nav__wa span { display: none; }
  .nav__wa .ico { width: 20px; height: 20px; }
}

/* ---------- первый экран: заголовок + одна строка + две кнопки, одно фото целиком, много воздуха ---------- */
.hero { min-height: calc(100svh - var(--nav-h)); display: flex; align-items: center; padding-block: clamp(32px, 6vh, 80px) clamp(48px, 9vh, 112px); }
.hero__grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: center; }
.hero__text { grid-column: 1 / span 5; }
.hero__h1 { font: 400 clamp(40px, 4.2vw, 62px)/1.04 var(--serif); letter-spacing: -.005em; color: var(--ink); }
.hero__h1 em { font-style: italic; }
.hero__line { display: block; }
.hero__sub { margin-top: 22px; max-width: 30em; font-size: 15px; line-height: 1.65; color: var(--ink-2); }
.hero__actions { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 26px; border: 1px solid var(--ink); font: 600 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; transition: background-color .3s, border-color .3s, color .3s; touch-action: manipulation; }
.btn--fill { background: var(--ink); color: var(--paper); }
.btn--fill:hover { background: #2B2B2B; border-color: #2B2B2B; }
.btn--line { color: var(--ink); border-color: var(--line-2); }
.btn--line:hover { border-color: var(--ink); }
.hero__fig { grid-column: 7 / -1; justify-self: end; width: min(100%, (100svh - var(--nav-h) - 200px) * .8, 460px); }
.hero__photo { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--paper-2); container-type: inline-size; }
.hero__photo img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
/* одна метка RICCA DESIGNS на фото — как на сайте (Montserrat 600, белая плашка, правый нижний угол) */
.mark { position: absolute; right: 12px; bottom: 12px; z-index: 2; padding: 6px 6px 6px 9px; background: rgba(255,255,255,.88); color: #111; font: 600 10px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none; }
@container (max-width: 259px) { .mark { right: 8px; bottom: 8px; padding: 5px 4px 5px 6px; font-size: 8px; letter-spacing: .24em; } }

@media (max-width: 899px) {
  .hero { align-items: flex-start; min-height: 0; padding-block: 20px 48px; }   /* кадр не прилипает к шапке */
  .hero__grid { display: flex; flex-direction: column; align-items: stretch; gap: 32px; }
  .hero__fig { order: -1; justify-self: auto; width: min(100%, (100svh - 400px) * .8); }   /* на 390×664 кадр уже, но целиком, кнопки в первом экране */
  .hero__h1 { font-size: clamp(34px, 9.4vw, 44px); line-height: 1.06; }
  .hero__sub { margin-top: 14px; }
  .hero__actions { margin-top: 28px; gap: 8px; }
  .hero__actions .btn { flex: 1 0 auto; padding: 0 14px; gap: 8px; letter-spacing: .12em; }   /* в ряд от 336 px, уже — «Каталог» переносится на всю ширину */
}

/* ---------- интро «Буквы» ---------- */
.intro-word { display: none; }
html.intro .intro-word { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; gap: 1.1em; font: 400 30px/1 var(--sans); color: var(--ink); pointer-events: none; }
html.intro .intro-word > span { display: block; opacity: 0; }
@media (max-width: 899px) { html.intro .intro-word { font-size: 22px; gap: 1em; } }
/* исходное состояние, пока ждём шрифт (≤ 350 мс): белый экран; кадр закрыт щелью нулевой высоты */
html.intro .lockup__mono, html.intro .lockup__rule, html.intro .lockup__name, html.intro .lockup__sub,
html.intro .nav__menu, html.intro .nav__wa, html.intro .hero__line, html.intro .hero__sub, html.intro .hero__actions, html.intro .mark { opacity: 0; }
html.intro .hero__photo { clip-path: inset(50% 50% 50% 50%); }
@media (prefers-reduced-motion: reduce) {
  html.intro .intro-word { display: none; }
  html.intro .lockup__mono, html.intro .lockup__rule, html.intro .lockup__name, html.intro .lockup__sub,
  html.intro .nav__menu, html.intro .nav__wa, html.intro .hero__line, html.intro .hero__sub, html.intro .hero__actions, html.intro .mark { opacity: 1; }
  html.intro .hero__photo { clip-path: none; }
}
</style>
</head>

<script>
/* Интро «Буквы». Хронометраж (мс от старта):
   80–560    R I C C A проявляются по одной (шаг 50, 280 мс, подъём .18em); пауза — слово читается целиком
   700–1220  слово сжимается в логотип шапки: FLIP каждой буквы к её месту в .lockup__name, все буквы разом —
             слово остаётся ровной строкой, разрядка стягивается (ease-out)
   680–860   в центре кадра прочерчивается щель в 1 px (из центра к краям)
   860–1400  щель раскрывается до полного кадра; фото внутри — 1,06 → 1
   1040–1580 заголовок, строка, кнопки; 1200–1560 остальная шапка; 1340–1580 метка RICCA DESIGNS
   Итог 1580 мс (+ уборка в следующем кадре) ≤ 1600 мс. Любое касание / колесо / клавиша — мгновенно к финалу. */
(function () {
  var html = document.documentElement;
  if (!html.classList.contains('intro')) return;
  var DEBUG = /[?&]introdebug\b/.test(location.search);
  var word = document.querySelector('.intro-word');
  var anims = [], over = false;
  var SKIP = ['pointerdown', 'keydown', 'wheel', 'touchstart'];

  function end() {
    if (over) return; over = true;
    clearTimeout(window.__introSafety);
    SKIP.forEach(function (e) { removeEventListener(e, end, true); });
    html.classList.remove('intro');            /* финальное состояние = обычные стили страницы */
    anims.forEach(function (a) { a.cancel(); });
    if (word) word.remove();
  }
  if (!word || !Element.prototype.animate || window.scrollY > 4) return end();
  try { if (!DEBUG) sessionStorage.setItem('ricca:intro', '1'); } catch (e) {}
  SKIP.forEach(function (e) { addEventListener(e, end, { capture: true, passive: true }); });

  var fonts = document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load('400 30px Montserrat', 'RICCA'), document.fonts.load('400 60px Cormorant', 'Мебель')])
    : Promise.resolve();
  var late = new Promise(function (r) { setTimeout(r, 350, 'late'); });
  Promise.race([fonts, late]).then(function (res) {
    if (over) return;
    if (res === 'late') return end();           /* шрифт не успел — без интро, чтобы не было подмены гарнитуры на глазах */
    requestAnimationFrame(run);
  }, end);

  function run() {
    if (over) return;
    var OUT = 'cubic-bezier(.22,1,.36,1)', SOFT = 'cubic-bezier(.33,1,.68,1)', EXPO = 'cubic-bezier(.16,1,.3,1)';
    function A(el, kf, o) {
      if (!el) return;
      o.fill = 'both'; if (!o.easing) o.easing = OUT;
      var a = el.animate(kf, o); anims.push(a); return a;
    }
    var src = [].slice.call(word.children);
    var dst = [].slice.call(document.querySelectorAll('.lockup__name > span'));
    var photo = document.querySelector('.hero__photo');

    /* все замеры — до создания анимаций (заливка «назад» сдвинула бы рамки) */
    var fly = src.map(function (s, i) {
      var a = s.getBoundingClientRect(), b = dst[i].getBoundingClientRect();
      return { dx: (b.left + b.width / 2) - (a.left + a.width / 2), dy: (b.top + b.height / 2) - (a.top + a.height / 2), k: b.height / a.height };
    });
    var pr = photo.getBoundingClientRect(), h2 = pr.height / 2, w2 = pr.width / 2;

    /* 1. буквы по одной: opacity + свойство translate (отдельно от transform полёта — анимации не спорят) */
    src.forEach(function (s, i) {
      A(s, [{ opacity: 0, translate: '0 .18em' }, { opacity: 1, translate: '0 0' }], { duration: 280, delay: 80 + i * 50, easing: SOFT });
    });
    /* 2. слово сжимается в логотип: каждая буква летит к своей букве в шапке, все разом (без шага — иначе слово рассыпается «лесенкой») */
    var FLY = 700, FLY_DUR = 520, flyEnd = FLY + FLY_DUR;
    src.forEach(function (s, i) {
      var f = fly[i];
      A(s, [{ transform: 'none' }, { transform: 'translate(' + f.dx + 'px,' + f.dy + 'px) scale(' + f.k + ')' }], { duration: FLY_DUR, delay: FLY });
    });
    /* передача: настоящий логотип включается под приземлившимися буквами, слово интро гаснет поверх — без провала яркости */
    A(document.querySelector('.lockup__name'), [{ opacity: 0 }, { opacity: 1 }], { duration: 1, delay: flyEnd - 1, easing: 'linear' });
    A(word, [{ opacity: 1 }, { opacity: 0 }], { duration: 120, delay: flyEnd, easing: 'linear' });

    /* 3. щель → полный кадр (clip-path в px: интерполяция без calc) */
    A(photo, [
      { clipPath: 'inset(' + h2 + 'px ' + w2 + 'px ' + h2 + 'px ' + w2 + 'px)', easing: SOFT },
      { clipPath: 'inset(' + (h2 - .5) + 'px 0px ' + (h2 - .5) + 'px 0px)', offset: .25, easing: EXPO },
      { clipPath: 'inset(0px 0px 0px 0px)' }
    ], { duration: 720, delay: 680, easing: 'linear' });
    A(photo.querySelector('img'), [{ transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 900, delay: 680, easing: EXPO });
    A(photo.querySelector('.mark'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: 1340, easing: 'linear' });

    /* 4. текст первого экрана и остальная шапка */
    var up = [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }];
    [].forEach.call(document.querySelectorAll('.hero__line'), function (el, i) { A(el, up, { duration: 480, delay: 1040 + i * 50 }); });
    A(document.querySelector('.hero__sub'), up, { duration: 440, delay: 1120 });
    A(document.querySelector('.hero__actions'), up, { duration: 420, delay: 1160 });
    ['.lockup__mono', '.lockup__rule', '.lockup__sub', '.nav__menu', '.nav__wa'].forEach(function (sel) {
      A(document.querySelector(sel), [{ opacity: 0 }, { opacity: 1 }], { duration: 360, delay: 1200, easing: SOFT });
    });

    if (DEBUG) {   /* ?introdebug — для раскадровки: стоп на t = 0, перемотка window.__intro.seek(ms) */
      anims.forEach(function (a) { a.pause(); a.currentTime = 0; });
      window.__intro = { seek: function (t) { anims.forEach(function (a) { a.currentTime = t; }); }, end: end, total: 1580 };
      return;
    }
    Promise.all(anims.map(function (a) { return a.finished; })).then(end, function () {});
  }
})();
</script>

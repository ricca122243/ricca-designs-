<!-- ПРОТОТИП I-c «Рамка» — минималистичный вход (правки заказчика 9 октября, ночь).
     Белый экран → по краям экрана тонко прорисовывается чёрная рамка → внутри неё, как картина на стене, проявляется фото
     (масштаб .92 → 1) → рамка растворяется → появляются заголовок, строка и две кнопки. Всего ≈1,55 с, только ease-out.
     Не играет: повторный визит в той же сессии (sessionStorage), prefers-reduced-motion, недоступный sessionStorage.
     Любое касание, колесо или клавиша — сразу финальный кадр. Без JS первый экран виден сразу и целиком.
     LCP-фото предзагружено и грузится с первого байта: анимация меняет только opacity/transform, загрузку не задерживает.
     ?intro=1 — сыграть ещё раз (для показа), ?intro=hold — не снимать класс в конце (для покадровой записи). -->

<script>
/* Решение «играть или нет» — до первой отрисовки, чтобы не было вспышки готового экрана перед интро. */
(function () {
  var d = document.documentElement, q = location.search;
  d.classList.replace('no-js', 'js');
  var force = /[?&]intro=(1|hold)\b/.test(q), hold = /[?&]intro=hold\b/.test(q);
  var still = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var seen = true;   // хранилище недоступно → не играем (иначе интро повторялось бы на каждой странице)
  try { seen = sessionStorage.getItem('ricca:intro-c') === '1'; } catch (e) {}
  if (!force && (seen || still)) return;
  try { sessionStorage.setItem('ricca:intro-c', '1'); } catch (e) {}
  d.classList.add('intro');
  if (hold) return;
  var done = false;
  function end() {
    if (done) return; done = true;
    d.classList.remove('intro');
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (t) { removeEventListener(t, end, true); });
  }
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (t) { addEventListener(t, end, { capture: true, passive: true }); });
  /* финал — по концу последней анимации (кнопки), страховка — 2,4 с */
  addEventListener('animationend', function (e) { if (e.animationName === 'ic-rise' && e.target.classList && e.target.classList.contains('hero__actions')) end(); });
  setTimeout(end, 2400);
})();

<style>
:root {
  --paper: #F7F5F0; --paper-2: #EDEAE4;
  --ink: #111111; --ink-2: rgba(17,17,17,.74); --ink-3: rgba(17,17,17,.6); --line: rgba(17,17,17,.14); --line-2: rgba(17,17,17,.42);
  --serif: 'Cormorant', 'Garamond', Georgia, serif;
  --sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --gutter: clamp(28px, 6vw, 96px);
  --nav-h: 76px;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-soft: cubic-bezier(.33, 1, .68, 1);
  --frame-inset: clamp(10px, 1.4vw, 22px);
}
@media (max-width: 759px) { :root { --nav-h: 60px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink-2); font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; font-synthesis: none; overflow-x: clip; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
h1, p, figure { margin: 0; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; }
::selection { background: var(--ink); color: var(--paper); }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.skip-link { position: fixed; top: 8px; left: 8px; z-index: 100; padding: 12px 16px; background: var(--ink); color: var(--paper); font: 500 13px/1 var(--sans); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nowrap { white-space: nowrap; }
.wrap { width: min(100% - 2 * var(--gutter), 1180px); margin-inline: auto; }

/* ---------- шапка: тонкая, мелкая ---------- */
.nav__row { height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.lockup { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); }
.lockup__mono { width: auto; height: 18px; }
.lockup__rule { width: 1px; height: 20px; background: var(--line-2); margin: 0 12px; opacity: .6; }
.lockup__text { display: flex; flex-direction: column; }
.lockup__name { font: 500 14px/1 var(--sans); letter-spacing: .46em; margin-right: -.46em; color: var(--ink); }
.lockup__sub { font: 500 7.5px/1 var(--sans); letter-spacing: .36em; color: var(--ink-3); margin-top: 6px; white-space: nowrap; }
.nav__menu { display: flex; gap: clamp(20px, 2.6vw, 40px); }
.nav__menu a, .nav__wa { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font: 500 10.5px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); transition: color .3s; }
.nav__menu a:hover, .nav__wa:hover { color: var(--ink); }
.nav__menu .ico { width: 12px; height: 12px; }
.nav__wa { color: var(--ink); }
@media (max-width: 999px) { .nav__menu { display: none; } }
@media (max-width: 759px) {
  .lockup__name { font-size: 13px; }
  .nav__wa { width: 44px; justify-content: center; }
  .nav__wa span { display: none; }
  .nav__wa .ico { width: 20px; height: 20px; }
}

/* ---------- первый экран: заголовок + строка + 2 кнопки, фото как картина на стене ---------- */
.hero { min-height: calc(100svh - var(--nav-h)); display: grid; align-items: center; padding-block: clamp(16px, 5vh, 64px) clamp(40px, 9vh, 96px); }
.hero__grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: clamp(48px, 8vw, 128px); }
.hero__text { max-width: 30em; }
.hero__h1 { font: 300 clamp(34px, 3.4vw, 52px)/1.1 var(--serif); letter-spacing: -.005em; color: var(--ink); text-wrap: balance; }
.hero__h1 em { font-style: italic; font-weight: 300; }
.hero__sub { margin-top: 18px; font-size: 14px; line-height: 1.65; color: var(--ink-2); max-width: 30em; }
.hero__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 24px; border: 1px solid var(--ink); font: 600 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; transition: background-color .35s var(--ease-soft), color .35s var(--ease-soft), border-color .35s var(--ease-soft); touch-action: manipulation; }
.btn--fill { background: var(--ink); color: var(--paper); }
.btn--fill:hover { background: #2a2a2a; border-color: #2a2a2a; }
.btn--line { border-color: var(--line-2); color: var(--ink); }
.btn--line:hover { border-color: var(--ink); }

.hero__media { position: relative; width: min(460px, 34vw, calc((100svh - var(--nav-h) - 170px) * .8)); aspect-ratio: 4 / 5; background: var(--paper-2); }
.hero__media img { width: 100%; height: 100%; object-fit: cover; }
/* единственная метка на фото — CSS-слой (MANIFEST, правило 2) */
/* вуаль цвета бумаги — для интро: фото проявляется из стены, но браузер считает его отрисованным сразу (LCP не ждёт конца интро) */
.hero__media::after { content: ""; position: absolute; inset: -2px; background: var(--paper); opacity: 0; pointer-events: none; }
.mark { position: absolute; right: 12px; bottom: 12px; padding: 6px 8px 6px 10px; background: rgba(255,255,255,.85); color: #111; font: 600 10px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; pointer-events: none; }

@media (max-width: 759px) {
  .hero { padding-block: 12px 32px; }
  .hero__grid { grid-template-columns: minmax(0, 1fr); gap: 30px; }
  .hero__media { order: -1; width: 100%; aspect-ratio: auto; height: max(260px, min(calc((100vw - 2 * var(--gutter)) * 1.2), calc(100svh - 344px))); }
  .hero__media img { object-position: 50% 62%; }
  .hero__h1 { font-size: clamp(32px, 9vw, 38px); }
  .hero__sub { margin-top: 12px; }
  .hero__actions { margin-top: 26px; flex-wrap: nowrap; }
  .hero__actions { gap: 8px; }
  .btn { padding: 0 14px; gap: 8px; font-size: 10px; letter-spacing: .12em; }
  .btn--fill { flex: 1 1 auto; }
  .mark { font-size: 8px; letter-spacing: .24em; right: 10px; bottom: 10px; padding: 5px 6px 5px 8px; }
}
@media (max-width: 389px) { .hero__actions { gap: 6px; } .btn { padding: 0 11px; letter-spacing: .08em; } }
@media (max-width: 359px) { .hero__actions { flex-wrap: wrap; } .btn--fill { flex-basis: 100%; } }

/* ---------- интро «Рамка» ---------- */
.frame { display: none; }
.intro .frame { display: block; position: fixed; inset: var(--frame-inset); z-index: 50; pointer-events: none; animation: ic-out 380ms var(--ease-soft) 880ms both; }
.frame i { position: absolute; background: var(--ink); }
.frame i:nth-child(1), .frame i:nth-child(3) { left: 0; right: 0; height: 1px; }
.frame i:nth-child(2), .frame i:nth-child(4) { top: 0; bottom: 0; width: 1px; }
.frame i:nth-child(1) { top: 0; } .frame i:nth-child(3) { bottom: 0; }
.frame i:nth-child(2) { right: 0; } .frame i:nth-child(4) { left: 0; }
/* стороны вырастают из середин и встречаются в углах */
.intro .frame i:nth-child(odd) { animation: ic-draw-x 600ms var(--ease-soft) 40ms both; }
.intro .frame i:nth-child(even) { animation: ic-draw-y 600ms var(--ease-soft) 40ms both; }
/* фото «вешают»: из тишины, чуть меньше, к своему месту (масштаб — на рамке фото, проявление — вуалью, не opacity самого фото) */
.intro .hero__media { animation: ic-hang 760ms var(--ease-out) 320ms both; }
.intro .hero__media::after { animation: ic-unveil 760ms var(--ease-out) 320ms both; }
.intro .nav { animation: ic-fade 520ms var(--ease-soft) 1000ms both; }
.intro .hero__h1 { animation: ic-rise 520ms var(--ease-out) 960ms both; }
.intro .hero__sub { animation: ic-rise 520ms var(--ease-out) 1010ms both; }
.intro .hero__actions { animation: ic-rise 520ms var(--ease-out) 1060ms both; }
@keyframes ic-draw-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ic-draw-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes ic-out { to { opacity: 0; } }
@keyframes ic-hang { from { transform: scale(.92); } to { transform: none; } }
@keyframes ic-unveil { from { opacity: 1; } to { opacity: 0; } }
@keyframes ic-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes ic-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .intro .frame { display: none; }
  .intro .hero__media, .intro .hero__media::after, .intro .nav, .intro .hero__h1, .intro .hero__sub, .intro .hero__actions { animation: none; }
}
</style>

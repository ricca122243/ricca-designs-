<!--
  ПРОТОТИП I-a · вход «Монограмма» (9 октября, ночь — «вход с минималистичным эффектом»).
  Сценарий, всего 1,6 с, только transform/opacity, ease-out:
    40–600 мс    на молочном экране тонким контуром (≈ 0,9 px) прорисовывается монограмма RD — маленькая, по центру
    360–760 мс   под ней вытягивается волосяная линия, проступает «RICCA DESIGNS»
    800–980 мс   знак уходит
    840–1360 мс  молочная «шторка» поднимается и открывает фото на весь экран (фото мягко оседает 1,04 → 1)
    1180–1600 мс последними проявляются заголовок, строка и кнопки
  Правила: один раз за сессию (sessionStorage «rd-intro»); при prefers-reduced-motion и без JS шторки нет вовсе — первый экран
  виден и работает сразу; любой клик, касание, колесо или клавиша сразу завершают вход; фото первого экрана грузится
  с preload/fetchpriority и лежит под шторкой непрозрачным — LCP не ждёт анимацию.
  Для просмотра ещё раз в той же вкладке: ?intro=1.
  Фото: на горизонтальных экранах № 32 (молочная гостиная с камином), на вертикальных — № 09 (голубой велюр):
  исходник под формат экрана, чтобы не увеличивать кадр («слишком близко»).
-->

<script>
/* Решение о входе — до первой отрисовки, чтобы не мигнул первый экран. Без JS класса нет → шторки нет. */
(function (h) {
  var rm = false, seen = false, force = /[?&]intro=1(&|$)/.test(location.search);
  try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  try { seen = sessionStorage.getItem('rd-intro') === '1'; sessionStorage.setItem('rd-intro', '1'); } catch (e) {}
  h.classList.add(!rm && (force || !seen) ? 'intro-play' : 'intro-skip');
})(document.documentElement);

<style>
:root {
  --paper: #F7F5F0; --paper-2: #EFECE6;
  --ink: #111111; --ink-2: rgba(17,17,17,.76); --ink-3: rgba(17,17,17,.6); --ink-4: rgba(17,17,17,.28);
  --serif: 'Cormorant', 'Garamond', Georgia, serif;
  --sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --gutter: clamp(20px, 4.4vw, 64px);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-lift: cubic-bezier(.45, 0, .12, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink-2); font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
h1, p { margin: 0; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; top: 8px; left: 8px; z-index: 60; padding: 12px 16px; background: var(--ink); color: var(--paper); transform: translateY(-200%); }
.skip-link:focus { transform: none; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- шапка: тонкая, поверх фото ---------- */
.nav { position: absolute; inset: 0 0 auto; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 84px; padding: 0 var(--gutter); color: var(--ink); }
.lockup { display: inline-flex; align-items: center; min-height: 44px; }
.lockup__mono { height: 20px; width: auto; }
.lockup__rule { width: 1px; height: 22px; background: var(--ink-4); margin: 0 12px; }
.lockup__text { display: flex; flex-direction: column; }
.lockup__name { font: 500 15px/1 var(--sans); letter-spacing: .46em; margin-right: -.46em; }
.lockup__sub { font: 500 7.5px/1 var(--sans); letter-spacing: .36em; color: var(--ink-3); margin-top: 6px; white-space: nowrap; }
.nav__menu { display: flex; gap: clamp(20px, 2.4vw, 36px); font: 500 10.5px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
.nav__menu a { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; position: relative; }
.nav__menu a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 12px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .4s var(--ease-out); }
.nav__menu a:hover::after { transform: scaleX(1); }
.nav__menu .ico { width: 12px; height: 12px; }
.nav__wa { display: none; width: 44px; height: 44px; align-items: center; justify-content: center; margin-right: -12px; }
.nav__wa .ico { width: 20px; height: 20px; }

/* ---------- первый экран ---------- */
.hero { position: relative; height: 100vh; height: 100svh; min-height: 320px; overflow: hidden; background: var(--paper); }
/* фото на 1 px короче экрана: Chromium не считает LCP картинку, закрывающую весь экран («фон»), и тогда LCP
   становится заголовок, который проявляется последним (~1,7 с). Так LCP — это фото, ~0,1 с (замер Playwright). */
.hero__media { position: absolute; inset: 0 0 1px; overflow: hidden; background: var(--paper-2); }
.hero__media picture, .hero__img { display: block; width: 100%; height: 100%; }
.hero__img { object-fit: cover; object-position: 50% 50%; }
.hero__media::after { content: ""; position: absolute; inset: 0 0 auto; height: 140px; background: linear-gradient(rgba(247,245,240,.55), rgba(247,245,240,0)); pointer-events: none; }
.mark { position: absolute; right: 16px; bottom: 16px; z-index: 2; padding: 6px 6px 6px 9px; background: rgba(255,255,255,.88); color: #111; font: 600 10px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; pointer-events: none; user-select: none; -webkit-user-select: none; }

/* текст — на молочной «этикетке», которая остаётся от шторки в левом нижнем углу: контраст не зависит от кадра
   (дымка поверх камина давала 2:1), фото не затемняется и не размывается */
.hero__text { position: absolute; left: 0; bottom: 0; z-index: 3; width: min(44vw, 600px); padding: clamp(36px, 5.6vh, 56px) clamp(28px, 4.4vw, 64px) clamp(36px, 6.4vh, 60px) var(--gutter); background: var(--paper); }
.hero__h1 { font: 300 clamp(36px, 3.3vw, 52px)/1.06 var(--serif); letter-spacing: -.005em; color: var(--ink); text-wrap: balance; }
.hero__h1 em { font-style: italic; font-weight: 300; }
.hero__sub { margin-top: 18px; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); text-wrap: balance; }
.hero__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 0 24px; border: 1px solid var(--ink); font: 600 10.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; transition: background-color .3s, color .3s, border-color .3s; }
.btn--fill { background: var(--ink); color: var(--paper); }
.btn--fill:hover { background: #2a2a2a; border-color: #2a2a2a; }
.btn--line { border-color: rgba(17,17,17,.46); color: var(--ink); }   /* рамка ≥ 3:1 к бумаге */
.btn--line:hover { border-color: var(--ink); }

/* вертикальные экраны (телефон, планшет стоя): фото — на всю ширину сверху, текст — на молочном поле под ним, кадр не увеличен */
@media not all and (min-aspect-ratio: 1/1) {
  .hero { display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 520px; }
  .hero__media { position: relative; inset: auto; }
  .hero__img { object-position: 50% 58%; }
  .mark { right: 12px; bottom: 12px; }
  .hero__text { position: relative; left: auto; bottom: auto; width: auto; padding: 30px var(--gutter) max(30px, env(safe-area-inset-bottom)); }
  .hero__h1 { font-size: clamp(32px, 8.6vw, 46px); }
  .hero__sub { margin-top: 12px; font-size: 14px; }
  .hero__actions { margin-top: 22px; gap: 8px; }
  .btn { min-height: 48px; padding: 0 16px; letter-spacing: .12em; }
  .btn--fill { flex: 1 1 auto; }
  .nav { height: 64px; }
  .nav__menu { display: none; }
  .nav__wa { display: inline-flex; }
}
@media (max-width: 899px) and (min-aspect-ratio: 1/1) { .nav__menu { display: none; } .nav__wa { display: inline-flex; } }
@media (max-height: 520px) and (min-aspect-ratio: 1/1) {   /* телефон лёжа */
  .hero__text { width: min(58vw, 560px); padding: 22px 28px 24px; }
  .hero__h1 { font-size: 30px; } .hero__sub { margin-top: 8px; font-size: 13.5px; } .hero__actions { margin-top: 16px; flex-wrap: nowrap; } .btn { padding: 0 16px; letter-spacing: .12em; }
  .nav { height: 60px; }
}
@media (max-width: 380px) { .btn { padding: 0 13px; gap: 8px; font-size: 10px; letter-spacing: .08em; } }
@media (max-width: 329px) { .btn .ico { display: none; } }

/* ---------- вход «Монограмма» ---------- */
.intro { display: none; }
.intro-play .intro { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--paper); will-change: transform; animation: rd-lift 520ms var(--ease-lift) 840ms both; }
.intro__mark { display: grid; justify-items: center; gap: 0; color: var(--ink); animation: rd-away 180ms ease-out 800ms both; }
.intro__mono { width: 76px; height: auto; overflow: visible; }
.intro__mono path { fill: none; stroke: currentColor; stroke-width: 6.5; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: rd-draw 560ms cubic-bezier(.4, 0, .2, 1) 40ms both; }   /* тонкий контур ≈ 0,9 px, без жирной заливки */
.intro__rule { width: 76px; height: 1px; margin-top: 20px; background: var(--ink-4); transform: scaleX(0); animation: rd-rule 400ms var(--ease-out) 360ms both; }
.intro__word { margin-top: 14px; margin-right: -.5em; font: 500 8.5px/1 var(--sans); letter-spacing: .5em; text-transform: uppercase; color: var(--ink-3); animation: rd-fade 300ms ease-out 460ms both; }
.intro-play .hero__img { animation: rd-settle 760ms var(--ease-out) 840ms both; }
.intro-play .hero__h1 { animation: rd-rise 380ms var(--ease-out) 1180ms both; }
.intro-play .hero__sub { animation: rd-rise 360ms var(--ease-out) 1220ms both; }
.intro-play .hero__actions { animation: rd-rise 340ms var(--ease-out) 1260ms both; }
@keyframes rd-draw { to { stroke-dashoffset: 0; } }
@keyframes rd-rule { to { transform: scaleX(1); } }
@keyframes rd-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rd-away { to { opacity: 0; transform: translateY(-10px); } }
@keyframes rd-lift { to { transform: translateY(-100%); visibility: hidden; } }
@keyframes rd-settle { from { transform: scale(1.04); } to { transform: none; } }
@keyframes rd-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .intro-play .intro { display: none; }
  .intro-play * { animation: none !important; }
}
</style>
